# 2GB heap: D8 dex merge için yeterli; paging file küçükse Windows'ta artır (4–8 GB)
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Proje farklı sürücüde (D:) Pub cache (C:) ise Kotlin incremental "different roots" hatası verir; kapatıyoruz
kotlin.incremental=false
# Aynı anda az iş: dex merge OOM riskini azaltır
org.gradle.workers.max=2